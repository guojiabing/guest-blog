name: 博客构建检查
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 检查类型与模板
        run: npm run check
      - name: 验证 Cloudflare 静态构建
        run: npm run build:cloudflare
